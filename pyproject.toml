[project]
name = "documind"
version = "0.1.0"
description = "Multi-document QA with hybrid retrieval, citations, and a LangGraph router"
requires-python = ">=3.11"
readme = "README.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
